name: Schedule Test

on:
  schedule:
    # 仅用于验证 GitHub schedule，不执行项目代码
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 定时触发测试
        run: |
          echo "GitHub schedule triggered"
          date -u
