# B站主播开播监控 - GitHub Actions 工作流
# 每 5 分钟请求运行一次，以降低 GitHub schedule 偶发延迟或丢任务的影响

name: B站开播监控

on:
  schedule:
    # GitHub schedule 是尽力触发；提高请求频率，使实际检测尽量保持在 10 分钟以内
    # 从 UTC 第 3 分开始错开整点高峰：03/08/13/18/.../58
    - cron: "3/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：normal=正常检查直播状态；test_notification=只测试微信通知（不改 state.json）"
        required: true
        type: choice
        options:
          - normal
          - test_notification
        default: "normal"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行（根据模式选择命令）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "test_notification" ]; then
            echo "本次运行：测试通知模式（不修改 state.json）"
            python main.py --test-notification
          else
            echo "本次运行：正常检查模式"
            python main.py
          fi

      - name: 保存状态（仅 state.json 变化时才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "状态未变化，不提交"
          else
            git commit -m "chore: update live state [skip ci]"
            git push
          fi
