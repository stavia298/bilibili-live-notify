# B站主播开播监控 - GitHub Actions 工作流
# 每 10 分钟自动检查一次"永夜秋殇"是否开播，状态变化时提交 state.json 回仓库

name: B站开播监控

on:
  schedule:
    # 每 10 分钟运行一次（cron 用 UTC，但 */10 不涉及时区，全天每 10 分钟一次）
    - cron: "*/10 * * * *"
  # 允许在 GitHub 网页手动点击 "Run workflow" 测试，不用等 10 分钟
  workflow_dispatch:

# contents: write 是为了把更新后的 state.json 用 git push 提交回仓库
# 只在状态变化时才提交，所以不会每 10 分钟产生无意义 commit
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest   # 标准免费 runner，0 成本
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"          # 缓存 pip 依赖，加速后续运行

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查直播状态并发通知
        env:
          # 从 GitHub Secrets 注入，Python 用 os.getenv 读取，绝不写进源码
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python main.py

      - name: 保存状态（仅 state.json 变化时才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # git diff --cached --quiet 为真表示没有变化，跳过提交
          if git diff --cached --quiet; then
            echo "状态未变化，不提交"
          else
            git commit -m "chore: update live state [skip ci]"
            git push
          fi
